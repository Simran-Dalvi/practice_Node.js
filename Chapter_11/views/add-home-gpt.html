<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb - Register Home</title>
    <link rel="stylesheet" href="/output.css">
</head>

<body class="bg-gray-50 min-h-screen">

    <!-- Navbar -->
    <header class="bg-white shadow-sm">
        <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <a href="/" class="text-2xl font-bold text-rose-500">
                Airbnb
            </a>

            <a
                href="/"
                class="text-gray-600 hover:text-rose-500 transition"
            >
                Back to Home
            </a>

        </nav>
    </header>

    <!-- Main -->
    <main class="flex items-center justify-center py-20 px-6">

        <div class="w-full max-w-2xl">

            <!-- Heading -->
            <div class="text-center mb-10">

                <h1 class="text-4xl font-bold text-gray-900">
                    Register Your Home
                </h1>

                <p class="mt-3 text-gray-500">
                    Start earning by hosting travelers from around the world.
                </p>

            </div>

            <!-- Form Card -->
            <div class="bg-white rounded-3xl shadow-lg p-8">

                <form
                    action="/host/add-home"
                    method="POST"
                    class="space-y-6"
                >

                    <!-- House Name -->
                    <div>

                        <label
                            class="block text-sm font-medium text-gray-700 mb-2"
                        >
                            House Name
                        </label>

                        <input
                            type="text"
                            name="Name"
                            placeholder="e.g. Mountain View Villa"
                            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-500"
                        >

                    </div>

                    <!-- Location -->
                    <div>

                        <label
                            class="block text-sm font-medium text-gray-700 mb-2"
                        >
                            Location
                        </label>

                        <input
                            type="text"
                            placeholder="e.g. Goa, India"
                            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-500"
                        >

                    </div>

                    <!-- Price -->
                    <div>

                        <label
                            class="block text-sm font-medium text-gray-700 mb-2"
                        >
                            Price Per Night
                        </label>

                        <input
                            type="number"
                            placeholder="4999"
                            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-500"
                        >

                    </div>

                    <!-- Description -->
                    <div>

                        <label
                            class="block text-sm font-medium text-gray-700 mb-2"
                        >
                            Description
                        </label>

                        <textarea
                            rows="4"
                            placeholder="Tell guests about your property..."
                            class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-rose-500"
                        ></textarea>

                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="w-full bg-rose-500 text-white py-4 rounded-xl font-semibold hover:bg-rose-600 hover:scale-[1.02] transition duration-300"
                    >
                        Register Home
                    </button>

                </form>

            </div>

        </div>

    </main>

</body>
</html>

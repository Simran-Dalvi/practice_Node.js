<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link rel="stylesheet" href="/output.css">
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center px-6">

    <div class="text-center max-w-xl">

        <!-- Big 404 -->
        <h1 class="text-9xl font-bold text-rose-500">
            404
        </h1>

        <!-- Message -->
        <h2 class="mt-6 text-3xl font-semibold text-gray-900">
            Page not found
        </h2>

        <p class="mt-4 text-gray-600 leading-relaxed">
            Sorry, the page you are looking for doesn’t exist or has been moved.
            Let’s get you back on track.
        </p>

        <!-- Button -->
        <div class="mt-10">
            <a
                href="/"
                class="inline-block bg-rose-500 text-white px-8 py-4 rounded-xl font-semibold hover:bg-rose-600 hover:scale-105 transition duration-300 shadow-md"
            >
                Go Back Home
            </a>
        </div>

    </div>

</body>
</html>

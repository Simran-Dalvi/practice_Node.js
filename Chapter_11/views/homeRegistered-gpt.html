<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb - Home Registered</title>
    <link rel="stylesheet" href="/output.css">
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-white shadow-sm">
        <nav class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

            <a href="/" class="text-2xl font-bold text-rose-500">
                Airbnb
            </a>

            <a
                href="/"
                class="text-gray-600 hover:text-rose-500 transition"
            >
                Home
            </a>

        </nav>
    </header>

    <!-- Success Section -->
    <main class="grow flex items-center justify-center px-6">

        <div class="bg-white shadow-xl rounded-3xl p-12 max-w-xl w-full text-center">

            <!-- Success Icon -->
            <div class="w-24 h-24 mx-auto rounded-full bg-green-100 flex items-center justify-center text-5xl">
                ✅
            </div>

            <!-- Heading -->
            <h1 class="mt-8 text-4xl font-bold text-gray-900">
                Home Registered!
            </h1>

            <!-- Description -->
            <p class="mt-4 text-gray-600 leading-relaxed">
                Congratulations! Your property has been successfully added.
                Guests can now discover and book your home.
            </p>

            <!-- Buttons -->
            <div class="mt-10 flex justify-center gap-4">

                <a
                    href="/"
                    class="bg-rose-500 text-white px-8 py-3 rounded-xl hover:bg-rose-600 transition duration-300 shadow-md"
                >
                    Go to Homepage
                </a>

                <a
                    href="/host/add-home"
                    class="border border-gray-300 px-8 py-3 rounded-xl hover:bg-gray-100 transition duration-300"
                >
                    Add Another Home
                </a>

            </div>

        </div>

    </main>

</body>
</html>

<!DOCTYPE html>

            <div class="flex gap-6 items-center">
                <a href="#" class="hover:text-rose-500 transition">

                </a>
            </div>
        </nav>
    </header>

    <main class="grow">

                        </div>

                        <p class="mt-2 text-gray-500">
                            Millions of reviews from happy guests.
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-gray-900 text-gray-300 py-8 sticky bottom-0">
        <div class="max-w-7xl mx-auto px-6 text-center">
